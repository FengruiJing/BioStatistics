<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四川省地图</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }
    p {
      margin: 0 0 14px;
      color: #4b5563;
    }
    iframe {
      width: 100%;
      height: 760px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>四川省地图（OpenStreetMap）</h1>
    <p>地图来源：OpenStreetMap，展示四川省行政边界关系（Relation 913068）。</p>
    <iframe
      title="四川省地图"
      src="https://www.openstreetmap.org/relation/913068#map=6/30.50/103.90"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </main>
</body>
</html>
